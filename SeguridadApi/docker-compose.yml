services:
  postgres-g7:
    image: postgres:16-alpine
    container_name: aeropuerto_pg_dev
    environment:
      POSTGRES_USER: pggrupo7
      POSTGRES_PASSWORD: pggrupo7
      POSTGRES_DB: pggrupo7
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      
     #  ./init.sql:/docker-entrypoint-initdb.d/init.sql
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aeropuerto_g7"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: